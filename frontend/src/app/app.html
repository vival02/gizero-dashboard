<app-header
  [layers]="layers"
  (layerChange)="onLayerChange($event)"
  (menuToggle)="onMenuToggle()"
  (timeoutChange)="onTimeoutChange($event)">
</app-header>

@if (modalita === 'simulazione') {
  <div class="sim-mode-banner">
    MODALITÀ SIMULAZIONE
  </div>
}

<div class="layout" [class.sim-attiva]="modalita === 'simulazione'">
  <app-side-menu
    [aperto]="menuAperto"
    [class.menu-mobile-aperto]="menuAperto"
    (click)="$event.stopPropagation()"
    (modalitaChange)="onModalitaChange($event)">
  </app-side-menu>

  <div class="map-container" (click)="onMapClick()">
    <app-map
      [modalita]="modalita"
      [layers]="layers"
      [mostraTimeout]="mostraTimeout"
      [gatewaySimulati]="gatewaySimulati"
      [nodiMigliorati]="nodiMigliorati"
      (nodoSelezionato)="onNodoSelezionato($event)"
      (mappaCliccata)="onMappaCliccata($event)">
    </app-map>

    @if (modalita === 'simulazione') {
      <app-simulazione-panel
        [nuoveCoordinate]="ultimoClick"
        (gatewayListChange)="onGatewayListChange($event)"
        (reset)="onSimulazioneReset()"
        (risultati)="onRisultatiSimulazione($event)">
      </app-simulazione-panel>
    }
  </div>

  <app-node-panel
    [nodo]="nodoSelezionato"
    (chiudi)="nodoSelezionato = null">
  </app-node-panel>
</div>
